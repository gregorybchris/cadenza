[project]
authors = [
    { name = "Chris Gregory", email = "christopher.b.gregory@gmail.com" },
]
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "types-pyyaml>=6.0.12.20241230",
]
description = "Exploration of music theory."
keywords = ["chord", "progression", "modulator", "music", "theory", "song"]
license = { text = "MIT" }
name = "cadenza-music"
readme = "README.md"
requires-python = ">=3.12"
version = "0.4.0"

[project.optional-dependencies]
audio = [
    "numpy>=2.4.6",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
]
plot = ["matplotlib>=3.10.1"]

[dependency-groups]
dev = [
    "covcheck[toml]>=0.4.3",
    "pytest-cov>=7.1.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "semver>=3.0.4",
]
plot = ["matplotlib>=3.10.1"]
audio = [
    "numpy>=2.4.6",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
]

[tool.uv]
default-groups = ["dev", "plot", "audio"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
exclude = ["planning", "songs.yaml", "dictionaries", ".cspell.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]

[project.urls]
repository = "https://github.com/gregorybchris/cadenza"

[project.scripts]
cz = "cadenza.cli:app"

[tool.covcheck]
branch = 0.0
line = 0.0

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
ignore = ["D100", "D104", "FIX002", "TD002", "TD003"]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "E",
    "EM",
    "ERA",
    "F",
    "FIX",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PL",
    "PT",
    "PTH",
    "PLR",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TD",
    "TID",
    "W",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"**/*.py" = ["A001", "A002"]
"**/tests/**/*.py" = ["SLF", "PLR2004", "PLR6301"]
"src/cadenza/cli.py" = ["T201", "T203"]
